name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        id: foundry
        uses: foundry-rs/foundry-toolchain@v1
        continue-on-error: true
        with:
          version: stable

      - name: Install Foundry (retry su flake di rete, es. 504 da GitHub API)
        if: steps.foundry.outcome == 'failure'
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Forge version
        run: forge --version

      - name: Format check
        run: forge fmt --check src test script

      - name: Build (with sizes)
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

  backend:
    name: Backend (API + PostgreSQL)
    runs-on: ubuntu-latest
    # Postgres reale: fa girare anche i test d'integrazione (PrismaStore, advisory lock)
    # che in locale restano skippati senza DATABASE_URL.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tinft
          POSTGRES_PASSWORD: tinft
          POSTGRES_DB: tinft_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://tinft:tinft@localhost:5432/tinft_test?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma migrate deploy (schema su DB pulito)
        run: pnpm --filter @tinft/api exec prisma migrate deploy

      - name: Typecheck
        run: pnpm --filter @tinft/api typecheck

      - name: Test (unit + integrazione PostgreSQL)
        run: pnpm --filter @tinft/api test

  frontend:
    name: Frontend (sintassi + regole economiche)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # L'app è una singola pagina con logica inline: senza questo controllo un errore
      # di sintassi arriverebbe in produzione (non esistono test frontend).
      - name: Sintassi degli script inline di apps/web
        run: node scripts/check-web-syntax.mjs

      # Guardia sulle regole economiche: i valori mostrati all'utente devono coincidere
      # con quelli enforced da contratti e backend (ha già intercettato "4%" e "royalty 10%").
      - name: Coerenza regole economiche (UI ↔ backend ↔ contratti)
        run: node scripts/check-economics.mjs

  secrets:
    name: Nessun segreto nel repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scansione segreti
        run: node scripts/check-secrets.mjs
