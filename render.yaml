# Render Blueprint — pubblica l'API TINFT (con i frontend e la test-app) online.
# Uso: su https://dashboard.render.com → New → Blueprint → collega il repo GitHub.
# Render legge questo file, builda il Dockerfile e crea il servizio web.
# I valori "sync: false" vanno inseriti a mano nella dashboard (sono segreti).
services:
  - type: web
    name: tinft-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /ready
    envVars:
      # --- persistenza: Postgres gestito (senza, il backend usa lo store in-memory
      #     e i dati si azzerano a ogni deploy). Le migrazioni girano allo start.
      - key: DATABASE_URL
        fromDatabase:
          name: tinft-db
          property: connectionString
      # --- pubblici (deploy Base Sepolia con burn all'ingresso) ---
      # Contratto TinftTicket rideployato con burn (markUsed → _burn sui normali,
      # Signature esenti). Sostituisce lo storico 0x8704…1F37 (senza burn).
      - key: TICKET_ADDRESS
        value: "0x0ecaf2e665256bbc86f8c7c992cbd3d44843db5d"
      - key: CHAIN_ID
        value: "84532"
      - key: SEED_DEMO
        value: "1"
      # --- generato da Render ---
      - key: AUTH_SECRET
        generateValue: true
      # --- SEGRETI: inseriscili nella dashboard (non finiscono nel repo) ---
      - key: CHAIN_RPC_URL
        sync: false # = il tuo Alchemy Base Sepolia
      - key: CHAIN_PRIVATE_KEY
        sync: false # = chiave OWNER del contratto (deployer)
      # --- Email reale (registrazione OTP via Resend) ---
      - key: RESEND_API_KEY
        sync: false # re_... (da resend.com → API Keys)
      - key: EMAIL_FROM
        value: "onboarding@resend.dev"
      # --- Pagamenti Stripe (TEST mode, opzionale) ---
      - key: STRIPE_SECRET_KEY
        sync: false # sk_test_... (Stripe → Developers → API keys, modalità Test)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # whsec_... (Stripe → Webhooks → endpoint https://<host>/webhooks/psp)

  # ---------------------------------------------------------------- STAGING
  # Copia di prova della produzione: stessa immagine, ma branch, database e
  # segreti SEPARATI. Serve a validare una modifica prima che tocchi il live
  # (e a provare i rollback senza rischi). Deploy dal branch `staging`.
  - type: web
    name: tinft-api-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    branch: staging
    autoDeploy: true
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tinft-db-staging # database DEDICATO: non tocca mai i dati di produzione
          property: connectionString
      - key: TICKET_ADDRESS
        value: "0x0ecaf2e665256bbc86f8c7c992cbd3d44843db5d"
      - key: CHAIN_ID
        value: "84532"
      - key: SEED_DEMO
        value: "1"
      - key: AUTH_SECRET
        generateValue: true # segreti DIVERSI dalla produzione: un token di staging non vale sul live
      - key: CHAIN_RPC_URL
        sync: false
      # In staging conviene NON impostare CHAIN_PRIVATE_KEY: senza chiave il backend
      # non scrive on-chain (niente gas consumato dalle prove). Impostala solo per
      # testare esplicitamente mint/burn.
      - key: CHAIN_PRIVATE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

# Postgres gestito: piano free (1 GB). ATTENZIONE: il free di Render viene
# ELIMINATO dopo 30 giorni — per un uso oltre la demo passare a un piano a
# pagamento dalla dashboard. Il backend passa da in-memory a PrismaStore
# appena DATABASE_URL è presente; `prisma migrate deploy` gira allo start.
databases:
  - name: tinft-db
    plan: free
    postgresMajorVersion: "16"

  # Database di staging: separato da quello di produzione, così le prove
  # (e le migrazioni nuove) non possono corrompere i dati reali.
  - name: tinft-db-staging
    plan: free
    postgresMajorVersion: "16"
